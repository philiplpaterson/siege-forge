[project]
name = "redteam-banking-agent"
version = "0.1.0"
description = "Red team exercise: adversarial agent vs banking AI assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.3",
    "anthropic>=0.83.0",
    "fastapi>=0.129.2",
    "uvicorn>=0.41.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
start = "uvicorn main:app --reload --port 8000"
